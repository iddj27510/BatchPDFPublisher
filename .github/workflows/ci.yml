name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  consistency:
    name: Consistency checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version sync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mcVer = (Select-String -Path 'src/modConstants.bas' -Pattern 'Public Const PRJ_VERSION.*"([^"]+)"').Matches.Groups[1].Value
          $readmeVer = (Select-String -Path 'README.md' -Pattern '\*\*Version:\*\*\s*([0-9.]+)').Matches.Groups[1].Value
          $depsVer = (Get-Content 'deps.lock.json' -Raw | ConvertFrom-Json).project.version
          $sbomVer = (Get-Content 'sbom.cdx.json' -Raw | ConvertFrom-Json).metadata.component.version
          $chgVer  = (Get-Content 'CHANGELOG.md' | Select-String -Pattern '^## \[([0-9.]+)\]' | Select-Object -First 1).Matches.Groups[1].Value

          Write-Host "modConstants.bas : $mcVer"
          Write-Host "README.md        : $readmeVer"
          Write-Host "deps.lock.json   : $depsVer"
          Write-Host "sbom.cdx.json    : $sbomVer"
          Write-Host "CHANGELOG.md     : $chgVer"

          $unique = @($mcVer, $readmeVer, $depsVer, $sbomVer, $chgVer) | Select-Object -Unique
          if ($unique.Count -ne 1) {
            Write-Error "Version mismatch: $($unique -join ' vs ')"
            exit 1
          }
          Write-Host "OK: all versions = $mcVer"

      - name: Check no forbidden folders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @('T08_EmptyFolder', 'scripts', 'docs/legacy')
          $fail = $false
          foreach ($f in $bad) {
            $n = @(git ls-files "$f/*").Count
            if ($n -gt 0) {
              Write-Error "Forbidden folder '$f' has $n tracked files."
              $fail = $true
            }
          }
          if ($fail) { exit 1 }
          Write-Host "OK: no forbidden folders."

      - name: Check a_modDev.bas is ignored
        shell: pwsh
        run: |
          if (-not (Test-Path '.gitignore')) { Write-Error '.gitignore missing'; exit 1 }
          $gi = Get-Content '.gitignore' -Raw
          if ($gi -notmatch 'a_modDev\.bas') {
            Write-Error 'a_modDev.bas not in .gitignore'
            exit 1
          }
          Write-Host "OK: a_modDev.bas is ignored."

      - name: Check CHANGELOG has entries
        shell: pwsh
        run: |
          $chg = Get-Content 'CHANGELOG.md' -Raw
          $count = ([regex]::Matches($chg, '(?m)^## \[[0-9]')).Count
          Write-Host "CHANGELOG entries: $count"
          if ($count -lt 5) {
            Write-Error "CHANGELOG has too few entries ($count). Expected >= 5."
            exit 1
          }
          Write-Host "OK."

      - name: Check SBOM is valid CycloneDX
        shell: pwsh
        run: |
          $sbom = Get-Content 'sbom.cdx.json' -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne 'CycloneDX') { Write-Error 'SBOM format is not CycloneDX'; exit 1 }
          if ($sbom.specVersion -ne '1.5')   { Write-Error "SBOM specVersion is $($sbom.specVersion), expected 1.5"; exit 1 }
          if (-not $sbom.components -or $sbom.components.Count -lt 1) { Write-Error 'SBOM has no components'; exit 1 }
          Write-Host "OK: CycloneDX 1.5, $($sbom.components.Count) components."

      - name: Check core source files exist
        shell: pwsh
        run: |
          $required = @(
            'src/modConstants.bas',
            'src/modEntry.bas',
            'src/modPDFExport.bas',
            'src/modLang.bas',
            'src/modTests.bas',
            'src/frmScan.frm',
            'src/frmReport.frm',
            'src/frmProgress.frm'
          )
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing required files: $($missing -join ', ')"
            exit 1
          }
          Write-Host "OK: all required files present."